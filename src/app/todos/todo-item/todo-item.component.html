<form [formGroup]="formGroup">
    <div class="todo-item" (mouseover)="displayActionButtons = true">
        @if (todoItem()) {
        <!--        <mat-checkbox class="todo-item__check" color="primary" [formControl]="isCompleted"></mat-checkbox>-->
        @if(todoItem()?.status === 'completed' || todoItem()?.selected) {
        <div class="todo-item__check">
            <mat-icon matSuffix (mousedown)="complete()">check_circle></mat-icon>
        </div>
        }@else {
        <div
            class="todo-item__check"
            (mouseover)="statusTodoItem = 'check_circle'"
            (mouseleave)="statusTodoItem = 'radio_button_unchecked'"
            (mousedown)="complete()">
            <mat-icon matSuffix>{{ statusTodoItem }}</mat-icon>
        </div>
        } }
        <input
            #addTodoItemInput
            class="todo-item__input todo-item__input--flat"
            [ngClass]="{
              'todo-item__input--editing': inputStatus.isEditing,
              'todo-item__input--completed': isCompleted.value,
              'todo-item__input--empty':!todoItem()
            }"
            [formControl]="name"
            [placeholder]="todoItem()?.name ? '' : 'Add new task'"
            [readOnly]="isCompleted.value"
            data-placeholder="'Nouvel élément'"
            (focusout)="onFocusOut()"
            (mouseout)="displayActionButtons = false"
            (keydown)="onKeyDown($event)" />
        <div class="todo-item__actions">
            @if (inputStatus.isEdited) {
            <mat-icon matSuffix class="success">check_circle</mat-icon>
            } @if (todoItem() && displayActionButtons) {
            <button mat-icon-button (click)="editItem()">
                <mat-icon fontIcon="edit">delete</mat-icon>
            </button>
            <button mat-icon-button (click)="onDelete()">
                <mat-icon class="error">delete</mat-icon>
            </button>
            } @if (!todoItem()) {
            <button mat-icon-button (click)="sendItem()" [disabled]="!name!.value?.length">
                <mat-icon>done</mat-icon>
            </button>
            }
        </div>
    </div>
</form>
