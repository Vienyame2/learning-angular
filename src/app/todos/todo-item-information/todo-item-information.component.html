<div class="fixActionRow">
    <mat-grid-list cols="2" rowHeight="2:1">
        <mat-grid-tile>
            <h2 mat-dialog-title>{{ data.name }}</h2>
        </mat-grid-tile>
        <mat-grid-tile>
          <button mat-icon-button (click)="onFavorite()">
            @if (todoItemForm.get('favorite')?.value) {
              <mat-icon>favorite</mat-icon>
            } @else {
              <mat-icon>favorite_border</mat-icon>
            }
          </button>
        </mat-grid-tile>
    </mat-grid-list>

    <mat-dialog-content>
        <form [formGroup]="todoItemForm">
            <mat-form-field>
                <mat-label>Name</mat-label>
                <input type="text" formControlName="name" matInput placeholder="Name" />
            </mat-form-field>
            <mat-form-field>
                <mat-label>Description</mat-label>
                <textarea matInput formControlName="description"></textarea>
            </mat-form-field>
        </form>
    </mat-dialog-content>
    <div class="spacer"></div>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close (click)="onCancel()">Cancel</button>
        <button mat-button color="primary" [mat-dialog-close]="true" (click)="submitItem()">Save</button>
    </mat-dialog-actions>
</div>
